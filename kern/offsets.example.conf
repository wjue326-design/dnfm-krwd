# dnfkern offsets 模板
#
# 这些是「内核结构体字段偏移」，每个 iOS 版本都不一样，必须按你机器的
# kernelcache 现场取，取法见 docs/PLAN.md 第 7 节。填错会 panic，填之前先 --dry 跑一遍。
#
# 取值来源（任选）：
#   1) 用 jtool2 / ipsw 从 kernelcache 里查符号和结构体；
#   2) 越狱后用 kallsyms 类工具导出；
#   3) 社区同版本 offsets 表，交叉验证两组再填。
#
# 单位：全部是十六进制，不带 0x 也行。

# struct proc
proc_list_next = 0x8
proc_list_prev = 0x10
proc_pid       = 0xbc
proc_comm      = 0x3a8

# struct task
task_proc      = 0x3e0

# dyld_all_image_infos
dyld_infos_count = 0x4
dyld_infos_array = 0x8

# struct dyld_image_info
dyld_image_size  = 0x20
dyld_image_path  = 0x8
