name: Build dnfm-krwd

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/sdks-tmp
          cd $HOME/sdks-tmp
          git sparse-checkout set iPhoneOS16.5.sdk
          rm -rf $THEOS/sdks
          mv $HOME/sdks-tmp $THEOS/sdks
          ls $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          brew install ldid || true
          if ! command -v ldid >/dev/null 2>&1; then
            curl -L -o "$HOME/ldid" https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x "$HOME/ldid"
            sudo mv "$HOME/ldid" /usr/local/bin/ldid
          fi
          ldid -h 2>&1 | head -2 || true

      - name: Build packages (rootless)
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          set -e
          echo "== build kernhelper =="
          cd kernhelper
          make package FINALPACKAGE=1
          ls -lh packages/ || true
          cd ..
          echo "== build krwtweak =="
          cd krwtweak
          make package FINALPACKAGE=1
          ls -lh packages/ || true
          cd ..
          echo "== all debs =="
          find . -name '*.deb' -print

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: dnfm-krwd-deb
          path: |
            kernhelper/packages/*.deb
            krwtweak/packages/*.deb
          if-no-files-found: error

      - name: Publish release with deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: dnfm-krwd build ${{ github.run_number }}
          files: |
            kernhelper/packages/*.deb
            krwtweak/packages/*.deb
          generate_release_notes: false
